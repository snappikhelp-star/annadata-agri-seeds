<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annadata Visitors Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0b1f14,#14532d,#22c55e);
    font-family:Arial, Helvetica, sans-serif;
    padding:20px;
}

.card{
    width:100%;
    max-width:500px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:24px;
    padding:35px;
    text-align:center;
    color:white;
    box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

.logo{
    font-size:48px;
    margin-bottom:10px;
}

h1{
    font-size:32px;
    margin-bottom:10px;
}

.sub{
    color:#d1fae5;
    margin-bottom:25px;
}

.number{
    font-size:82px;
    font-weight:900;
    line-height:1;
    color:#fef08a;
    text-shadow:0 0 20px rgba(255,255,255,0.3);
}

.label{
    font-size:24px;
    margin-top:10px;
}

.growth{
    display:inline-block;
    margin-top:15px;
    background:#16a34a;
    padding:8px 18px;
    border-radius:999px;
    font-weight:bold;
}

.stats{
    margin-top:30px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.box{
    background:rgba(255,255,255,0.08);
    padding:15px;
    border-radius:16px;
}

.box h3{
    font-size:14px;
    color:#d1fae5;
    margin-bottom:8px;
}

.box p{
    font-size:24px;
    font-weight:bold;
}

.footer{
    margin-top:25px;
    font-size:13px;
    color:#d1fae5;
}

@media(max-width:600px){
    .number{
        font-size:60px;
    }

    h1{
        font-size:24px;
    }

    .stats{
        grid-template-columns:1fr;
    }
}
</style>

</head>
<body>

<div class="card">

    <div class="logo">🌾</div>

    <h1>ANNADATA AGRI & SEEDS</h1>

    <p class="sub">Website Launch Performance Demo</p>

    <div class="number">10.2K</div>

    <div class="label">Visitors</div>

    <div class="growth">▲ +18.4% Growth</div>

    <div class="stats">

        <div class="box">
            <h3>Page Views</h3>
            <p>18.7K</p>
        </div>

        <div class="box">
            <h3>Unique Visitors</h3>
            <p>10.2K</p>
        </div>

        <div class="box">
            <h3>Average Load Time</h3>
            <p>2.2s</p>
        </div>

        <div class="box">
            <h3>Conversion Rate</h3>
            <p>8.4%</p>
        </div>

    </div>

    <div class="footer">
        Demo Analytics Visualization
    </div>

</div>

</body>
</html>
